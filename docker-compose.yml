services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:                                                                       
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app:/app/backend
      
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - VITE_API_BASE=/api
    depends_on:
      - backend
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

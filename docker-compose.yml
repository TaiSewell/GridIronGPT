services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:                                                                                                  
      - ./data/gridiron.db:/app/data/gridiron.db
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app:/app/backend
      - DB_PATH=/app/data/gridiron.db
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://localhost:8000
    depends_on:
      - backend

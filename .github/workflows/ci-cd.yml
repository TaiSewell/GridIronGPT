name: CI/CD

# Trigger only on push to main
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # -------------------------
  # Backend Tests & Build
  # -------------------------
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        run: |
          pytest || echo "No tests yet"

# -------------------------
  # Frontend Tests & Build
  # -------------------------
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: |
          npm test -- --watch=false || echo "No tests yet"

      - name: Build frontend
        run: npm run build

  # -------------------------
  # Deploy (after CI)
  # -------------------------
  deploy:
    runs-on: ubuntu-latest
    needs:
        - backend
        - frontend

  steps:
    - uses: actions/checkout@v4

    - name: Placeholder deploy
    run: echo "Deploy step not implemented yet – skipping."
